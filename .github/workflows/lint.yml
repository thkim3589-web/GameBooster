name: Lint check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**', 'res/**', 'libs/**', 'AndroidManifest.xml', 'tools/lint/**']

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Android Lint
        working-directory: tools/lint
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle -q :app:compileDebugJavaWithJavac :app:lintDebug --no-daemon
          echo "===== LINT REPORT ====="
          cat app/build/lint.txt
