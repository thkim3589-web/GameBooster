name: Build & Release APK

on:
  push:
    branches: [main]
    paths-ignore: ['README.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 앱 서명 키 — 처음 설치한 앱과 같은 키여야 업데이트가 됨
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 시크릿이 없어요. 서명 키가 다르면 기존 앱 위에 업데이트가 안 되므로 빌드를 멈춥니다."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/gb.keystore"

      - name: Build APK
        env:
          KEYSTORE: ${{ runner.temp }}/gb.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          export VERSION_CODE=$((100 + ${{ github.run_number }}))
          export VERSION_NAME="$(tr -d ' \r\n' < VERSION)"
          export OUT=GameBooster.apk
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          chmod +x build.sh
          ./build.sh

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_CODE }}
          name: ${{ env.VERSION_NAME }}
          body_path: RELEASE_NOTES.md
          make_latest: true
          files: GameBooster.apk
