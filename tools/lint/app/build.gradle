plugins { id 'com.android.application' version '8.7.3' }
android {
  namespace 'com.thkim.gamebooster'
  compileSdk 34
  defaultConfig { minSdk 26; targetSdk 33; versionCode 6; versionName "1.5" }
  sourceSets { main {
    manifest.srcFile '../../../AndroidManifest.xml'
    java.srcDirs = ['../../../src']
    res.srcDirs = ['../../../res']
    assets.srcDirs = ['../../../assets']
  } }
  compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
  dependencies { implementation fileTree(dir: '../../../libs', include: '*.jar') }
  lint { abortOnError false; checkReleaseBuilds false; textReport true; textOutput file("$buildDir/lint.txt") }
}
